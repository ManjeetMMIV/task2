services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.local
    container_name: langrag-backend
    ports:
      - "8001:8000"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: langrag-frontend
    ports:
      - "5173:80"
      - "5174:443"
    depends_on:
      - backend
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: langrag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
